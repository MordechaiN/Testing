version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Transcription System
#
# CPU: Intel Xeon E-2124 — 4 cores / 4 threads (NO hyperthreading)
#      Base 3.3 GHz / Turbo 4.3 GHz / TDP 71W / AVX2 ✓
#
# CPU pinning strategy:
#   CPU 0       → infra (evolution-api, redis, postgres, celery-beat)
#   CPUs 1,2,3  → transcription workload (api + celery-worker + whisper)
#   Metabase    → unpinned (admin-only, runs rarely, Java needs burst headroom)
#
# WHISPER_THREADS=3: matches 3 dedicated physical cores exactly.
# Thermal note: Whisper on 3 cores at turbo (4.3 GHz) approaches 71W TDP.
# If lm-sensors shows throttling, lower WHISPER_THREADS to 2 in .env.
#
# Security: postgres and redis are on transcription_net only — no external exposure.
# All external traffic routes through Caddy with TLS + basicauth where needed.
#
# Audio retention:
#   audio_temp  → deleted after each job (safety-net cleanup at 3:30 AM)
#   audio_store → kept for AUDIO_RETENTION_DAYS, deleted by Celery Beat at 3:00 AM
#
# Model upgrade:
#   WHISPER_MODEL=medium         (default, 769MB, ~15s/min audio on E-2124)
#   WHISPER_MODEL=ivrit-ai/...   only if medium accuracy insufficient (~60s/min)
#   Change WORKER_MEM_LIMIT to 3g if switching to large-v3
# ─────────────────────────────────────────────────────────────────────────────

networks:
  transcription_net:
    driver: bridge
    internal: false   # needs internet for model download on first start
  proxy:
    external: true    # Caddy's existing bridge network

volumes:
  redis_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/redis/data"}
  postgres_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/postgres/data"}
  evolution_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/evolution-api"}
  models_cache:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/models"}
  audio_temp:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/audio_temp"}
  audio_store:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/audio_store"}
  metabase_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/metabase"}

services:

  # ─── WhatsApp Bridge ───────────────────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2-latest
    container_name: evolution-api
    restart: unless-stopped
    networks:
      - transcription_net
      - proxy
    volumes:
      - evolution_data:/evolution/instances
    environment:
      SERVER_URL: "https://${EVOLUTION_DOMAIN}"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://n8n:5678/webhook/whatsapp"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      QRCODE_LIMIT: "30"
      DATABASE_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      REDIS_ENABLED: "false"
      LOG_LEVEL: ERROR
    mem_limit: 512m
    cpuset: "0"
    labels:
      caddy: "${EVOLUTION_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis (broker + rate-limit store) ────────────────────────────────────
  # Not exposed externally — transcription_net only.
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    restart: unless-stopped
    networks:
      - transcription_net
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 300mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --loglevel warning
    mem_limit: 350m
    cpuset: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  # Not exposed externally — transcription_net only.
  postgres:
    image: postgres:16-alpine
    container_name: transcription-postgres
    restart: unless-stopped
    networks:
      - transcription_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: transcriptions
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    mem_limit: 300m
    cpuset: "0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d transcriptions"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Transcription API ────────────────────────────────────────────────────
  transcription-api:
    build:
      context: "${SCRIPTS_PATH}/transcription-service"
      dockerfile: Dockerfile
    image: transcription-service:local
    container_name: transcription-api
    restart: unless-stopped
    networks:
      - transcription_net
      - proxy
    volumes:
      - models_cache:/app/models
      - audio_temp:/app/audio_temp
      - audio_store:/app/audio_store
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/transcriptions"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_THREADS: "${WHISPER_THREADS:-3}"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      LANG_CACHE_TTL_DAYS: "${LANG_CACHE_TTL_DAYS:-60}"
      MAX_AUDIO_MINUTES_PER_DAY: "${MAX_AUDIO_MINUTES_PER_DAY:-120}"
      MAX_QUEUE_PER_USER: "${MAX_QUEUE_PER_USER:-5}"
      COOLDOWN_SECONDS: "${COOLDOWN_SECONDS:-3}"
      MAX_SINGLE_AUDIO_MINUTES: "${MAX_SINGLE_AUDIO_MINUTES:-10}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    mem_limit: 512m
    cpuset: "1,2,3"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      caddy: "${TRANSCRIPTION_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8000}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Celery Worker (transcription) ────────────────────────────────────────
  celery-worker:
    image: transcription-service:local
    container_name: transcription-worker
    restart: unless-stopped
    networks:
      - transcription_net
    volumes:
      - models_cache:/app/models
      - audio_temp:/app/audio_temp
      - audio_store:/app/audio_store
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/transcriptions"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_THREADS: "${WHISPER_THREADS:-3}"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      LANG_CACHE_TTL_DAYS: "${LANG_CACHE_TTL_DAYS:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      celery -A tasks worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      -Q transcription
    # medium: 1500m | large-v3: 3g
    mem_limit: "${WORKER_MEM_LIMIT:-1500m}"
    cpuset: "1,2,3"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Celery Beat (scheduled tasks) ────────────────────────────────────────
  celery-beat:
    image: transcription-service:local
    container_name: transcription-beat
    restart: unless-stopped
    networks:
      - transcription_net
    volumes:
      - audio_store:/app/audio_store
      - audio_temp:/app/audio_temp
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/transcriptions"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: celery -A tasks beat --loglevel=info
    mem_limit: 128m
    cpuset: "0"
    depends_on:
      - celery-worker

  # ─── Metabase (Admin Analytics Dashboard) ─────────────────────────────────
  # Access: https://${METABASE_DOMAIN} — protected by Caddy basicauth
  # First-run setup wizard runs at port 3000.
  metabase:
    image: metabase/metabase:latest
    container_name: transcription-metabase
    restart: unless-stopped
    networks:
      - transcription_net
      - proxy
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: transcriptions
      MB_DB_PORT: "5432"
      MB_DB_USER: "${POSTGRES_USER}"
      MB_DB_PASS: "${POSTGRES_PASSWORD}"
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Jerusalem
      MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE: "false"
    mem_limit: 600m
    # No cpuset — Metabase is admin-only and runs rarely. Java needs burst
    # headroom for query execution. Unpinned so it doesn't fight infra on CPU 0.
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      caddy: "${METABASE_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 3000}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
