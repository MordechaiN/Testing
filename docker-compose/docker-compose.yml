version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Transcription System — integrates with existing wa_llm stack
#
# CPU: Intel Xeon E-2124 — 4 cores / 4 threads (NO hyperthreading)
#      Base 3.3 GHz / Turbo 4.3 GHz / TDP 71W / AVX2 ✓
#
# CPU pinning:
#   CPU 0       → infra (redis, celery-beat, metabase)
#   CPUs 1,2,3  → transcription workload (api + celery-worker + whisper)
#
# REUSES from existing wa_llm stack (must be running first):
#   - wa_llm_postgres  (pgvector/pgvector:pg16) — saves RAM, pgvector included
#   - wa_llm_whatsapp  (go-whatsapp-web-multidevice) — WhatsApp client
#   - wa_llm_net       — shared internal Docker network
#
# Webhook flow:
#   go-whatsapp → n8n:5678/webhook/whatsapp
#   n8n routes: audio → transcription-api, everything else → wa_llm:5001
#
# One-time DB setup (run once before first start):
#   docker exec -it wa_llm_postgres psql -U wa_llm_user -d wa_llm \
#     -c "CREATE DATABASE transcriptions;"
#   docker exec -it wa_llm_postgres psql -U wa_llm_user \
#     -c "GRANT ALL ON DATABASE transcriptions TO wa_llm_user;"
#
# Audio retention:
#   audio_temp  → deleted after each job
#   audio_store → kept AUDIO_RETENTION_DAYS days, cleaned by Celery Beat at 3 AM
#
# Model:
#   WHISPER_MODEL=medium  (~15s/min on E-2124, 769MB RAM)
#   If throttling: lower WHISPER_THREADS to 2 in .env
# ─────────────────────────────────────────────────────────────────────────────

networks:
  wa_llm_net:
    external: true   # join existing wa_llm network
  proxy:
    external: true   # Caddy's existing bridge network

volumes:
  redis_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/redis"}
  models_cache:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/models"}
  audio_temp:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/audio_temp"}
  audio_store:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/transcription/audio_store"}
  metabase_data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${APPDATA_PATH}/metabase"}

services:

  # ─── Redis (Celery broker + rate-limit cache) ──────────────────────────────
  # Not in existing stack — added here.
  transcription-redis:
    image: redis:7-alpine
    container_name: transcription-redis
    restart: unless-stopped
    networks:
      - wa_llm_net
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 300mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --loglevel warning
    mem_limit: 350m
    cpuset: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Transcription API ────────────────────────────────────────────────────
  transcription-api:
    build:
      context: "${SCRIPTS_PATH}/transcription-service"
      dockerfile: Dockerfile
    image: transcription-service:local
    container_name: transcription-api
    restart: unless-stopped
    networks:
      - wa_llm_net
      - proxy
    volumes:
      - models_cache:/app/models
      - audio_temp:/app/audio_temp
      - audio_store:/app/audio_store
    environment:
      REDIS_URL: "redis://transcription-redis:6379/0"
      # Uses existing wa_llm_postgres, separate 'transcriptions' database
      DATABASE_URL: "postgresql://${WA_POSTGRES_USER}:${WA_POSTGRES_PASSWORD}@wa_llm_postgres/transcriptions"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_THREADS: "${WHISPER_THREADS:-3}"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      LANG_CACHE_TTL_DAYS: "${LANG_CACHE_TTL_DAYS:-60}"
      MAX_AUDIO_MINUTES_PER_DAY: "${MAX_AUDIO_MINUTES_PER_DAY:-120}"
      MAX_QUEUE_PER_USER: "${MAX_QUEUE_PER_USER:-5}"
      COOLDOWN_SECONDS: "${COOLDOWN_SECONDS:-3}"
      MAX_SINGLE_AUDIO_MINUTES: "${MAX_SINGLE_AUDIO_MINUTES:-10}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    mem_limit: 512m
    cpuset: "1,2,3"
    depends_on:
      transcription-redis:
        condition: service_healthy
    labels:
      caddy: "${TRANSCRIPTION_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8000}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Celery Worker ────────────────────────────────────────────────────────
  celery-worker:
    image: transcription-service:local
    container_name: transcription-worker
    restart: unless-stopped
    networks:
      - wa_llm_net
    volumes:
      - models_cache:/app/models
      - audio_temp:/app/audio_temp
      - audio_store:/app/audio_store
    environment:
      REDIS_URL: "redis://transcription-redis:6379/0"
      DATABASE_URL: "postgresql://${WA_POSTGRES_USER}:${WA_POSTGRES_PASSWORD}@wa_llm_postgres/transcriptions"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_THREADS: "${WHISPER_THREADS:-3}"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      LANG_CACHE_TTL_DAYS: "${LANG_CACHE_TTL_DAYS:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      celery -A tasks worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      -Q transcription
    mem_limit: "${WORKER_MEM_LIMIT:-1500m}"
    cpuset: "1,2,3"
    depends_on:
      transcription-redis:
        condition: service_healthy

  # ─── Celery Beat (scheduler) ──────────────────────────────────────────────
  celery-beat:
    image: transcription-service:local
    container_name: transcription-beat
    restart: unless-stopped
    networks:
      - wa_llm_net
    volumes:
      - audio_store:/app/audio_store
      - audio_temp:/app/audio_temp
    environment:
      REDIS_URL: "redis://transcription-redis:6379/0"
      DATABASE_URL: "postgresql://${WA_POSTGRES_USER}:${WA_POSTGRES_PASSWORD}@wa_llm_postgres/transcriptions"
      AUDIO_TEMP_DIR: /app/audio_temp
      AUDIO_STORE_DIR: /app/audio_store
      AUDIO_RETENTION_DAYS: "${AUDIO_RETENTION_DAYS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: celery -A tasks beat --loglevel=info
    mem_limit: 128m
    cpuset: "0"
    depends_on:
      - celery-worker

  # ─── Metabase (Admin Analytics) ───────────────────────────────────────────
  # Connects to existing wa_llm_postgres — can query both wa_llm and
  # transcriptions databases from one dashboard.
  metabase:
    image: metabase/metabase:latest
    container_name: transcription-metabase
    restart: unless-stopped
    networks:
      - wa_llm_net
      - proxy
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: transcriptions
      MB_DB_PORT: "5432"
      MB_DB_USER: "${WA_POSTGRES_USER}"
      MB_DB_PASS: "${WA_POSTGRES_PASSWORD}"
      MB_DB_HOST: wa_llm_postgres
      JAVA_TIMEZONE: Asia/Jerusalem
      MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE: "false"
    mem_limit: 600m
    # Unpinned — admin-only, Java needs burst headroom for queries
    depends_on:
      - transcription-redis
    labels:
      caddy: "${METABASE_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 3000}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
